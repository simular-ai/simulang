version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
    versioning-strategy: 'increase'
    groups:
      linter:
        patterns:
          - 'oxlint'
          - 'prettier'
          - 'typescript'
          - '@types/node'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    cooldown:
      default-days: 7
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore'
